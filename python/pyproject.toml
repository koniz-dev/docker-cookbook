[project]
name = "sample"
version = "0.1.0"
description = "Docker cookbook Python sample"
requires-python = ">=3.13"
dependencies = [
    "fastapi==0.136.3",
    "uvicorn==0.34.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
