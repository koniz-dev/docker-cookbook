# Local observability stack: OTel Collector + Prometheus + Tempo + Grafana.
# Point your app at OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
# Run: docker compose -f compose/docker-compose.observability.yml up

name: cookbook-observability

services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.115.1
    command: ["--config=/etc/otel/config.yaml"]
    configs:
      - source: otel-config
        target: /etc/otel/config.yaml
    ports:
      - "4317:4317"  # OTLP gRPC
      - "4318:4318"  # OTLP HTTP
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.0.1
    configs:
      - source: prom-config
        target: /etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    restart: unless-stopped

  tempo:
    image: grafana/tempo:2.6.1
    command: ["-config.file=/etc/tempo.yaml"]
    configs:
      - source: tempo-config
        target: /etc/tempo.yaml
    ports:
      - "3200:3200"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.4.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    ports:
      - "3001:3000"
    depends_on: [prometheus, tempo]
    restart: unless-stopped

configs:
  otel-config:
    content: |
      receivers:
        otlp:
          protocols:
            grpc:
              endpoint: 0.0.0.0:4317
            http:
              endpoint: 0.0.0.0:4318
      processors:
        batch: {}
      exporters:
        prometheus:
          endpoint: 0.0.0.0:8889
        otlp/tempo:
          endpoint: tempo:4317
          tls: { insecure: true }
      service:
        pipelines:
          traces:
            receivers: [otlp]
            processors: [batch]
            exporters: [otlp/tempo]
          metrics:
            receivers: [otlp]
            processors: [batch]
            exporters: [prometheus]
  prom-config:
    content: |
      scrape_configs:
        - job_name: otel-collector
          scrape_interval: 15s
          static_configs:
            - targets: ['otel-collector:8889']
  tempo-config:
    content: |
      server:
        http_listen_port: 3200
      distributor:
        receivers:
          otlp:
            protocols:
              grpc: { endpoint: 0.0.0.0:4317 }
      storage:
        trace:
          backend: local
          local:
            path: /tmp/tempo/traces
          wal:
            path: /tmp/tempo/wal
