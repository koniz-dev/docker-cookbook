name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: build ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: go,                  context: ./go,     file: ./go/Dockerfile }
          - { name: go-distroless,       context: ./go,     file: ./go/Dockerfile.distroless }
          - { name: go-scratch,          context: ./go,     file: ./go/Dockerfile.scratch }
          - { name: python,              context: ./python, file: ./python/Dockerfile }
          - { name: python-distroless,   context: ./python, file: ./python/Dockerfile.distroless }
          - { name: node,                context: ./node,   file: ./node/Dockerfile }
          - { name: node-distroless,     context: ./node,   file: ./node/Dockerfile.distroless }
          - { name: java,                context: ./java,   file: ./java/Dockerfile }
          - { name: java-distroless,     context: ./java,   file: ./java/Dockerfile.distroless }
          - { name: react,               context: ./react,  file: ./react/Dockerfile }
          - { name: react-scratch,       context: ./react,  file: ./react/Dockerfile.scratch }
          - { name: rust,                context: ./rust,   file: ./rust/Dockerfile }
          - { name: rust-distroless,     context: ./rust,   file: ./rust/Dockerfile.distroless }
          - { name: bun,                 context: ./bun,    file: ./bun/Dockerfile }
          - { name: bun-distroless,      context: ./bun,    file: ./bun/Dockerfile.distroless }
          - { name: dotnet,              context: ./dotnet, file: ./dotnet/Dockerfile }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build (load locally, do not push)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: false
          load: true
          tags: cookbook-${{ matrix.name }}:ci
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
      - name: Trivy scan
        uses: aquasecurity/trivy-action@0.36.0
        with:
          image-ref: cookbook-${{ matrix.name }}:ci
          format: table
          severity: CRITICAL,HIGH
          exit-code: 0
          ignore-unfixed: true
